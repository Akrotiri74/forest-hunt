<title>Forest Hunt</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 30px 20px;
        background: #f4f4f4;
    }

    h1 {
        margin-bottom: 5px;
    }

    .box {
        background: white;
        padding: 20px;
        margin-top: 20px;
        border-radius: 10px;
    }

    button,
    .camera-button {
        display: inline-block;
        padding: 12px 18px;
        margin-top: 10px;
        font-size: 16px;
        cursor: pointer;
        border: 0;
        border-radius: 6px;
        background: #333;
        color: white;
    }

    #location {
        margin-top: 15px;
        line-height: 1.6;
    }

    #preview {
        max-width: 100%;

        color: #666;
        font-size: 14px;

</style>

</head>

<body>

```
<h1>🌲 Forest Hunt</h1>
<p>Prototype 1</p>

<div class="box">
    <h2>Your location</h2>

    <button onclick="getLocation()">
        Get My Location
    </button>

    <div id="location">
        Location not yet obtained.
    </div>
</div>

<div class="box">
    <h2>Your photograph</h2>

    <label class="camera-button">
        Take Photo
        <input
            type="file"
            accept="image/*"
            capture="environment"
            id="photoInput"
            hidden
        >
    </label>

    <img id="preview" alt="Your photograph">

    <p class="small">
        On a phone, this should open the camera.
    </p>
</div>

<script>
    function getLocation() {

        const locationElement = document.getElementById("location");

        if (!navigator.geolocation) {
            locationElement.textContent =
                "Your browser does not support GPS location.";
            return;
        }

        locationElement.textContent =
            "Getting your location...";

        navigator.geolocation.getCurrentPosition(

            function(position) {

                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                locationElement.innerHTML =
                    "<strong>Latitude:</strong> " + latitude + "<br>" +
                    "<strong>Longitude:</strong> " + longitude + "<br>" +
                    "<strong>Accuracy:</strong> approximately " +
                    Math.round(accuracy) + " metres";
            },

            function(error) {

                locationElement.textContent =
                    "Could not get your location. " +
                    error.message;
            }
        );
    }


    const photoInput =
        document.getElementById("photoInput");

    const preview =
        document.getElementById("preview");


    photoInput.addEventListener("change", function() {

        const file = photoInput.files[0];

        if (!file) {
            return;
        }

        const imageUrl = URL.createObjectURL(file);

        preview.src = imageUrl;
        preview.style.display = "block";
    });
</script>
```
