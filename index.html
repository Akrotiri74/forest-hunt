<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forest Hunt</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f4f4f4;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        button {
            padding: 12px 18px;
            margin: 5px 0;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #888;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #location {
            margin-top: 15px;
            line-height: 1.6;
        }

        #challengeClue {
            margin-top: 20px;
            padding: 15px;
            background: #eef7ee;
            border-radius: 8px;
        }

        #photoPreview {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 8px;
        }

        #photoResult {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>🌲 Forest Hunt</h1>

    <!-- LOCATION -->
    <section>
        <h2>Your Location</h2>

        <button onclick="getLocation()">
            Get My Location
        </button>

        <div id="location">
            Location not checked yet.
        </div>
    </section>


    <!-- CHALLENGE -->
    <section>
        <h2>Challenge 1</h2>

        <button onclick="checkChallenge()">
            Check Challenge Location
        </button>

        <button onclick="setTargetToMyLocation()">
            Set Target to My Location (Test)
        </button>

        <div id="challengeResult">
            🔒 Challenge locked.
        </div>

        <!-- Hidden until player reaches the target -->
        <div id="challengeClue" style="display:none;">

            <h3>🌲 Challenge 1</h3>

            <p>
                Find a tree with a distinctive split trunk.
                Take a photograph showing the split.
            </p>

            <p>
                <strong>Your task:</strong>
                Take a photo of the tree.
            </p>

        </div>
    </section>


    <!-- CAMERA -->
    <section>
        <h2>📷 Your Photo</h2>

        <input
            type="file"
            id="photoInput"
            accept="image/*"
            capture="environment"
        >

        <br><br>

        <img
            id="photoPreview"
            style="display:none;"
            alt="Your photo"
        >

        <br>

        <button
            id="submitPhoto"
            onclick="submitPhoto()"
            disabled
        >
            Submit Photo
        </button>

        <p id="photoResult"></p>

    </section>


<script>

    // --------------------------------------------------
    // TEST CHALLENGE LOCATION
    // --------------------------------------------------

    let targetLatitude = 52.5000;
    let targetLongitude = 0.7000;

    // Player must be within this distance
    // to unlock the challenge.
    const challengeRadius = 50;


    // --------------------------------------------------
    // STORE PLAYER LOCATION
    // --------------------------------------------------

    let playerLatitude = null;
    let playerLongitude = null;


    // --------------------------------------------------
    // GET LOCATION
    // --------------------------------------------------

    function getLocation() {

        if (!navigator.geolocation) {

            document.getElementById("location").innerHTML =
                "Geolocation is not supported by this browser.";

            return;
        }

        document.getElementById("location").innerHTML =
            "Getting your location...";

        navigator.geolocation.getCurrentPosition(

            function(position) {

                playerLatitude = position.coords.latitude;
                playerLongitude = position.coords.longitude;

                const accuracy = position.coords.accuracy;

                document.getElementById("location").innerHTML =

                    "Latitude: " +
                    playerLatitude.toFixed(6) +

                    "<br>Longitude: " +
                    playerLongitude.toFixed(6) +

                    "<br>Accuracy: approximately " +
                    Math.round(accuracy) +
                    " metres";

            },

            function(error) {

                document.getElementById("location").innerHTML =
                    "Could not get your location.";

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }


    // --------------------------------------------------
    // DISTANCE CALCULATION
    // --------------------------------------------------

    function distanceInMetres(
        lat1,
        lon1,
        lat2,
        lon2
    ) {

        const earthRadius = 6371000;

        const lat1Radians = lat1 * Math.PI / 180;
        const lat2Radians = lat2 * Math.PI / 180;

        const differenceLatitude =
            (lat2 - lat1) * Math.PI / 180;

        const differenceLongitude =
            (lon2 - lon1) * Math.PI / 180;

        const a =
            Math.sin(differenceLatitude / 2) *
            Math.sin(differenceLatitude / 2) +

            Math.cos(lat1Radians) *
            Math.cos(lat2Radians) *

            Math.sin(differenceLongitude / 2) *
            Math.sin(differenceLongitude / 2);

        const c =
            2 * Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );

        return earthRadius * c;
    }


    // --------------------------------------------------
    // CHECK CHALLENGE
    // --------------------------------------------------

    function checkChallenge() {

        if (
            playerLatitude === null ||
            playerLongitude === null
        ) {

            document.getElementById("challengeResult").innerHTML =
                "📍 Please get your location first.";

            return;
        }

        const distance = distanceInMetres(
            playerLatitude,
            playerLongitude,
            targetLatitude,
            targetLongitude
        );

        if (distance <= challengeRadius) {

            document.getElementById("challengeResult").innerHTML =
                "🔓 Challenge unlocked!";

            document.getElementById("challengeClue").style.display =
                "block";

        } else {

            document.getElementById("challengeResult").innerHTML =
                "🔒 Not there yet.<br>" +
                Math.round(distance) +
                " metres from the target.";

            document.getElementById("challengeClue").style.display =
                "none";
        }
    }


    // --------------------------------------------------
    // TEST MODE
    // Set target to the player's current location
    // --------------------------------------------------

    function setTargetToMyLocation() {

        if (!navigator.geolocation) {

            document.getElementById("challengeResult").innerHTML =
                "Geolocation is not supported.";

            return;
        }

        document.getElementById("challengeResult").innerHTML =
            "Getting your location...";

        navigator.geolocation.getCurrentPosition(

            function(position) {

                targetLatitude =
                    position.coords.latitude;

                targetLongitude =
                    position.coords.longitude;

                playerLatitude =
                    position.coords.latitude;

                playerLongitude =
                    position.coords.longitude;

                document.getElementById("challengeResult").innerHTML =
                    "🧪 Test target set to your current location.";

                document.getElementById("challengeClue").style.display =
                    "none";
            },

            function(error) {

                document.getElementById("challengeResult").innerHTML =
                    "Could not get your location.";

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }


    // --------------------------------------------------
    // PHOTO SELECTION
    // --------------------------------------------------

    document
        .getElementById("photoInput")
        .addEventListener(
            "change",
            function(event) {

                const file =
                    event.target.files[0];

                if (!file) {
                    return;
                }

                const image =
                    document.getElementById("photoPreview");

                image.src =
                    URL.createObjectURL(file);

                image.style.display =
                    "block";

                document.getElementById("submitPhoto").disabled =
                    false;

                document.getElementById("photoResult").innerHTML =
                    "";
            }
        );


    // --------------------------------------------------
    // SUBMIT PHOTO
    // --------------------------------------------------

    function submitPhoto() {

        const photoInput =
            document.getElementById("photoInput");

        const photoResult =
            document.getElementById("photoResult");

        if (photoInput.files.length === 0) {

            photoResult.innerHTML =
                "📷 Please take a photo first.";

            return;
        }

        photoResult.innerHTML =
            "✅ Challenge 1 complete! Well done.";

        document.getElementById("submitPhoto").disabled =
            true;
    }

</script>

</body>
</html>
